name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check planning documents and links
        run: python3 scripts/check_repo.py
      - name: Backend checks, when backend exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/pyproject.toml ]; then
            python3 -m pip install -e 'backend[dev]'
            python3 -m ruff check backend
            python3 -m pytest backend/tests
          else
            echo 'Backend not implemented yet; skipped.'
          fi
      - name: Frontend checks, when frontend exists
        shell: bash
        run: |
          set +e
          : > frontend-check.log
          exec > >(tee -a frontend-check.log) 2>&1
          if [ ! -f apps/web/package.json ]; then
            echo 'Frontend not implemented yet; skipped.'
            exit 0
          fi
          cd apps/web
          npm install --no-audit --no-fund
          status=$?
          if [ $status -ne 0 ]; then exit $status; fi
          if npm run | grep -qE '^  lint'; then
            npm run lint
            status=$?
            if [ $status -ne 0 ]; then exit $status; fi
          else
            echo 'Frontend lint script not implemented yet; skipped.'
          fi
          npm run typecheck
          status=$?
          if [ $status -ne 0 ]; then exit $status; fi
          if npm run | grep -qE '^  test'; then
            npm test -- --run
            status=$?
            if [ $status -ne 0 ]; then exit $status; fi
          else
            echo 'Frontend tests not implemented yet; skipped.'
          fi
          npm run build
          status=$?
          exit $status
      - name: Upload frontend check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-log
          path: frontend-check.log
          if-no-files-found: ignore
