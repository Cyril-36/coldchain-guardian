[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
]
agent = [
    "strands-agents>=1.50,<2",
    "strands-agents-tools>=0.1,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coldchain*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
