[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-guardian-backend"
version = "0.1.0"
description = "Backend packages for the ColdChain Guardian synthetic demonstration"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coldchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
